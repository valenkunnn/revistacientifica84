<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural del Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff7c2; /* amarillo claro */
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ffd739;
            padding: 20px;
            text-align: center;
            color: black;
            font-size: 28px;
            font-weight: bold;
        }

        .contenedor {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        img {
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            margin-top: 20px;
        }

        p {
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>Mural del Club</header>

    <div class="contenedor">
        <h2>Proyecto Mural del Club</h2>
        <p>Te mostramos el avance del mural del club.</p>

        <img src="inicio mural del club.jpg" alt="Mural del Club">
    </div>

</body>
</html>
