<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural del Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8cc;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            background: #ffd43b;
            padding: 20px;
            margin: 0;
            font-size: 28px;
        }

        p {
            font-size: 18px;
            margin: 15px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 7px rgba(0,0,0,0.2);
        }

        .btn-volver {
            display: inline-block;
            background: #ffd43b;
            padding: 12px 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            text-decoration: none;
            color: black;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .btn-volver:hover {
            background: #ffce1a;
        }
    </style>
</head>
<body>

    <h1>Mural del Club</h1>

    <p>Aquí te mostramos los avances del mural del club.</p>

    <div class="gallery">
        <img src="muralclub.jpg" alt="Mural del club">
        <img src="muralclub1.jpg" alt="Mural del club 1">
        <img src="muralclub2.jpg" alt="Mural del club 2">
    </div>

    <a class="btn-volver" href="index.html">Volver al inicio</a>

</body>
</html>
