<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revista Científica - Club Jorge Bosco Lescano</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      background: linear-gradient(180deg, #ffcc66, #ff9966);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #ffb84d;
      color: #4a2600;
      padding: 25px 0;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .contenedor {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
    }

    .boton {
      text-decoration: none;
      color: #fff;
      font-size: 22px;
      background-color: #ff9933;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 280px;
    }

    .boton:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .boton img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 3px solid rgba(255, 255, 255, 0.6);
    }

    .boton p {
      background-color: #ff8000;
      margin: 0;
      padding: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header>
    Revista Científica - Club de Ciencias Jorge Bosco Lescano
  </header>

  <div class="contenedor">
    <a href="visitas.html" class="boton">
      <img src="minis3.jpg" alt="Visitas">
      <p>Visitas</p>
    </a>
  </div>
</body>
</html>
