<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club - Inicio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8cc;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            background: #ffd43b;
            padding: 20px;
            margin: 0;
            font-size: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
            text-decoration: none;
            color: black;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card p {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background: #fff2a8;
        }
    </style>
</head>
<body>

    <h1>Proyecto del Club</h1>

    <div class="container">

        <!-- MURAL DEL CLUB (portada actualizada) -->
        <a class="card" href="mural.html">
            <img src="muralclub2.jpg" alt="Mural del club">
            <p>Mural del Club</p>
        </a>

        <!-- RECAUDACIÓN -->
        <a class="card" href="recaudacion.html">
            <img src="recaudacion club 1.jpg" alt="Recaudación">
            <p>Recaudación</p>
        </a>

        <!-- VIAJES -->
        <a class="card" href="viajes.html">
            <img src="viaje conae4.jpg" alt="Viajes del club">
            <p>Viajes del Club</p>
        </a>

        <!-- COMEDOG (nuevo) -->
        <a class="card" href="comedog.html">
            <img src="comedog.jpg" alt="ComeDog">
            <p>ComeDog</p>
        </a>

    </div>

</body>
</html>
