<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revista Científica - ConCiencia</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      background: linear-gradient(180deg, #ffcc66, #ff9966);
      margin: 0;
      padding: 0;
      color: #4a2600;
    }

    header {
      background-color: #ffb84d;
      color: #4a2600;
      padding: 25px 0;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .logos img {
      height: 100px;
      width: auto;
    }

    h1 {
      margin: 10px 0 5px 0;
      font-size: 36px;
      letter-spacing: 1.5px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: normal;
    }

    .contenedor {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
    }

    .boton {
      text-decoration: none;
      color: #fff;
      font-size: 22px;
      background-color: #ff9933;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 280px;
    }

    .boton:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .boton img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 3px solid rgba(255, 255, 255, 0.6);
    }

    .boton p {
      margin: 10px;
      font-weight: bold;
    }

    footer {
      margin-top: 30px;
      padding-bottom: 20px;
    }

    footer img {
      width: 160px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <div class="logos">
      <img src="logoclub.png" alt="Logo del Club ConCiencia">
      <img src="escudos.png" alt="Escudo del Colegio Jorge Vosco Lescano">
    </div>
    <h1>Revista Científica - ConCiencia</h1>
    <h2>Club de Ciencias del Colegio Jorge Vosco Lescano</h2>
  </header>

  <div class="contenedor">
    <a href="visitas.html" class="boton">
      <img src="minis3.jpg" alt="Visita al Mini Club">
      <p>Proyecto Mini Club</p>
    </a>
  </div>

  <footer>
    <img src="escudos.png" alt="Escudo del Colegio Jorge Vosco Lescano">
  </footer>
</body>
</html>
