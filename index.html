<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club ConCiencia - Revista Científica</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff176;
      color: #3e2723;
      min-height: 100vh;
    }

    header {
      background-color: #ffb300;
      color: white;
      padding: 1.5rem 2rem;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 2rem;
    }

    .logo-club {
      width: 60px;
      height: auto;
    }

    .bloques {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin: 3rem auto;
      width: 90%;
      max-width: 900px;
    }

    .bloque {
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 15px;
      width: 260px;
      text-align: center;
      text-decoration: none;
      color: #3e2723;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .bloque:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .bloque img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px 15px 0 0;
    }

    .bloque p {
      padding: 1rem;
      font-size: 1.2rem;
      background-color: rgba(255, 235, 59, 0.8);
      border-radius: 0 0 15px 15px;
      font-weight: bold;
    }

    footer {
      background-color: #ffb300;
      color: white;
      padding: 0.5rem 2rem;
      font-weight: bold;
      box-shadow: 0 -3px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    footer img {
      width: 20px;
      height: auto;
    }

    @media (max-width: 480px) {
      .header-title {
        font-size: 1.5rem;
        width: 100%;
        text-align: center;
      }
      header {
        justify-content: center;
      }
      .logo-club {
        width: 50px;
      }
    }
  </style>
</head>
<body>

<header>
  <span class="header-title">Revista Científica del Club ConCiencia</span>
  <img src="logoclub.png" alt="Logo del Club" class="logo-club">
</header>

<div class="bloques">

  <!-- VISITAS -->
  <a href="visitas.html" class="bloque">
    <img src="minis3.jpg" alt="Visitas">
    <p>Visitas</p>
  </a>

  <!-- SANAMENTE -->
  <a href="saludmental.html" class="bloque">
    <img src="charlasanamente.jpg" alt="SanaMente">
    <p>Proyecto SanaMente</p>
  </a>

  <!-- PLÁSTICOS 3D -->
  <a href="plasticos3d.html" class="bloque">
    <img src="plasticos3d.jpg" alt="Plásticos 3D">
    <p>Plásticos 3D</p>
  </a>

  <!-- GIRASOL -->
  <a href="girasol.html" class="bloque">
    <img src="girasol.jpg" alt="Girasol">
    <p>Proyecto Girasol</p>
  </a>

  <!-- MOVIMIENTO INFINITO -->
  <a href="movimientoinfinito.html" class="bloque">
    <img src="minf1.jpg" alt="Movimiento Infinito">
    <p>Movimiento Infinito</p>
  </a>

  <!-- MURAL -->
  <a href="mural.html" class="bloque">
    <img src="muralclub2.jpg" alt="Mural del Club">
    <p>Mural del Club</p>
  </a>

  <!-- RECAUDACIÓN -->
  <a href="recaudacion.html" class="bloque">
    <img src="recaudacion club.jpg" alt="Recaudación">
    <p>Recaudación</p>
  </a>

  <!-- VIAJES -->
  <a href="viajes.html" class="bloque">
    <img src="viaje conae4.jpg" alt="Viajes del Club">
    <p>Viajes del Club</p>
  </a>

  <!-- COMEDOG -->
  <a href="comedog.html" class="bloque">
    <img src="comedog.jpg" alt="ComeDog">
    <p>ComeDog</p>
  </a>

</div>

<footer>
  <span>Club ConCiencia® 2025 — Todos los derechos reservados</span>
  <img src="escudoesc.png" alt="Escudo">
</footer>

</body>
</html>
