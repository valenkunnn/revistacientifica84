<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club ConCiencia - Revista Científica</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff176; /* amarillo intenso */
      color: #3e2723;
      min-height: 100vh;
    }

    header {
      background-color: #ffb300;
      color: white;
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: 2rem;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    .logo-club {
      display: block;
      margin: 10px auto 0 auto; /* centrado debajo del título */
      width: 60px; /* tamaño seguro */
      height: auto;
    }

    .bloques {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin: 3rem auto;
      width: 90%;
      max-width: 900px;
    }

    .bloque {
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 15px;
      width: 260px;
      text-align: center;
      text-decoration: none;
      color: #3e2723;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .bloque:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .bloque img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px 15px 0 0;
    }

    .bloque p {
      padding: 1rem;
      font-size: 1.2rem;
      background-color: rgba(255, 235, 59, 0.8);
      border-radius: 0 0 15px 15px;
      font-weight: bold;
    }

    footer {
      background-color: #ffb300;
      color: white;
      padding: 0.5rem 2rem;
      font-weight: bold;
      box-shadow: 0 -3px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    footer img {
      width: 20px; /* escudo pequeño */
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    Revista Científica del Club ConCiencia
    <img src="logoclub.png" alt="Logo del Club" class="logo-club">
  </header>

  <div class="bloques">
    <a href="visitas.html" class="bloque">
      <img src="minis3.jpg" alt="Visitas del Club ConCiencia">
      <p>Visita a la Escuela Jerónimo del Barco</p>
    </a>

    <a href="saludmental.html" class="bloque">
      <img src="charlasanamente.jpg" alt="Proyecto SanaMente">
      <p>Proyecto SanaMente</p>
    </a>
  </div>

  <footer>
    <span>Club ConCiencia® 2025, todos los derechos reservados</span>
    <img src="escudoesc.png" alt="Escudo del Club">
  </footer>
</body>
</html>
