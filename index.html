<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club ConCiencia - Revista Científica</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff9c4; /* amarillo claro */
      color: #3e2723;
      min-height: 100vh;
    }

    header {
      background-color: #ffb300;
      color: white;
      text-align: center;
      padding: 1.5rem;
      font-size: 2rem;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    .bloques {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin: 3rem auto;
      width: 90%;
      max-width: 900px;
    }

    .bloque {
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 15px;
      width: 260px;
      text-align: center;
      text-decoration: none;
      color: #3e2723;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .bloque:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .bloque img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px 15px 0 0;
    }

    .bloque p {
      padding: 1rem;
      font-size: 1.2rem;
      background-color: rgba(255, 235, 59, 0.8);
      border-radius: 0 0 15px 15px;
      font-weight: bold;
    }

    footer {
      background-color: #ffb300;
      color: white;
      text-align: center;
      padding: 1rem;
      font-weight: bold;
      box-shadow: 0 -3px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <header>Revista Científica del Club ConCiencia</header>

  <div class="bloques">
    <a href="visitas.html" class="bloque">
      <img src="minis3.jpg" alt="Visitas del Club ConCiencia">
      <p>Visita a la Escuela Jerónimo del Barco</p>
    </a>

    <a href="saludmental.html" class="bloque">
      <img src="charlasanamente1.jpg" alt="Proyecto SanaMente">
      <p>Proyecto SanaMente</p>
    </a>
  </div>

  <footer>
    Club ConCiencia © 2025
  </footer>
</body>
</html>
