<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recaudación - Club ConCiencia</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff176; /* amarillo intenso */
      margin: 0;
      padding: 20px;
      color: #3e2723;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: rgba(255, 255, 255, 0.6);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .galeria img {
      width: 260px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      font-weight: bold;
      color: #3e2723;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Recaudación</h1>

    <p>
      Esta sección muestra parte del trabajo realizado para recaudar fondos y sostener las actividades del Club ConCiencia.
      Cada aporte, evento y acción solidaria permite continuar impulsando proyectos científicos y educativos para toda la comunidad.
    </p>

    <div class="galeria">
      <img src="recaudacion club 1.jpg" alt="Recaudación 1">
      <img src="recaudacion club.jpg" alt="Recaudación 2">
    </div>

    <a href="index.html">Volver</a>
  </div>
</body>
</html>
